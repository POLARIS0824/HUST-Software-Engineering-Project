<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>JustMD 原型方案比较</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f2ef;color:#24211d;font-family:system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:40px 24px}h1{font-size:36px;margin:0 0 12px}p{line-height:1.7;color:#655f57}nav{display:flex;gap:8px;margin:24px 0}button{font:inherit;padding:12px 24px;border:1px solid #c7beb2;border-radius:24px;background:white;cursor:pointer}button[aria-pressed=true]{background:#514164;color:white;border-color:#514164}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}article h2{font-size:20px}article p{font-size:14px;min-height:48px}.screen{display:block;width:100%;border-radius:20px;box-shadow:0 8px 32px #21192c20}a{color:#5d477b}footer{margin-top:32px}@media(max-width:700px){.grid{grid-template-columns:1fr}.screen{max-width:390px}main{padding:24px}article p{min-height:0}}
</style>
<main><h1>JustMD，三种方向。</h1><p>同一份笔记，同一个 Android 原型。以下是 Pixel 10 模拟器原始截图。点击图片查看原图。原型仅用于研究，编辑内容只保留在当前会话。</p>
<nav><button aria-pressed="true" onclick="show('library',this)">笔记列表</button><button aria-pressed="false" onclick="show('editor',this)">编辑页</button></nav>
<div class="grid">
<article><h2>A · 深色工作台</h2><p>偏知识库和技术笔记。深色表面、目录感和更紧凑的行距。</p><a data-variant="a"><img class="screen" alt="A 深色工作台"></a></article>
<article><h2>B · 纸张笔记</h2><p>偏日常记录和阅读。暖白纸面、琥珀色操作和更少的图标。</p><a data-variant="b"><img class="screen" alt="B 纸张笔记"></a></article>
<article><h2>C · 灵感手册</h2><p>偏 Android 原生体验。M3 Expressive 字级、分组表面和明确的记录入口。</p><a data-variant="c"><img class="screen" alt="C 灵感手册"></a></article>
</div><footer><p>可以组合不同方案的列表与编辑页。技术证据见 <a href="research-report.md">研究报告</a>。完整编辑器、可靠保存、中文输入法和大规模性能均未验收。</p></footer></main>
<script>
function show(view,button){for(const a of document.querySelectorAll('[data-variant]')){const src=`screenshots/${a.dataset.variant}-${view}.png`;a.href=src;a.firstElementChild.src=src}for(const b of document.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b===button))}show('library',document.querySelector('button'));
</script></html>
