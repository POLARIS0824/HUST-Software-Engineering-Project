<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; connect-src 'none'"><style>
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface);color:var(--onSurface)}
#editor{position:fixed;inset:0;height:100%;width:100%}.cm-editor{height:100%;font-size:16px;background:var(--surface);color:var(--onSurface)}
#editor .cm-scroller{overflow:auto;font-family:monospace;line-height:1.65}#editor .cm-content{padding:24px 20px 100px;caret-color:var(--primary)}
.cm-focused{outline:none!important}.cm-cursor{border-left-color:var(--primary)!important}.cm-selectionBackground,.cm-focused .cm-selectionBackground{background:var(--selection)!important}
.cm-activeLine{background:var(--container)}.cm-gutters{background:var(--container);color:var(--muted);border-color:var(--outline)}
</style></head><body><div id="editor"></div><script src="cm.bundle.js"></script></body></html>
