# JustMD Windows 版基本构建与测试（PR #1 评审建议补充 CI）。
# 仅当 windows/ 或本文件变更时触发，不影响 android/ 的开发流程。
name: windows-ci

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-ci.yml"

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: windows/JustMD
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/JustMD/go.mod
          cache-dependency-path: windows/JustMD/go.sum

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未经 gofmt 格式化："
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test（无 cgo）
        run: CGO_ENABLED=0 go test ./...

      - name: mygo vet
        run: go tool mygo vet .
